[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "botpipe"
version = "2.0.0"
description = "Provider-first SDK and durable Python workflow runtime."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Botpipe contributors"},
]
keywords = [
  "agents",
  "automation",
  "codex",
  "workflow",
  "runtime",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "jinja2>=3.1,<4",
  "pydantic>=2.12,<3",
  "jsonschema>=4,<5",
  "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://github.com/mrauter1/botpipe"
Repository = "https://github.com/mrauter1/botpipe"
Issues = "https://github.com/mrauter1/botpipe/issues"
Documentation = "https://github.com/mrauter1/botpipe#readme"

[project.scripts]
botpipe = "botpipe.cli:main"

[tool.setuptools.packages.find]
include = ["botpipe*", "botpipe_optimizer*", "labs*"]

[tool.setuptools.package-data]
botpipe = [
  "py.typed",
  "pi_sdk_bridge.mjs",
  "workflows/**/*",
]
labs = ["workflows/**/*"]

[tool.setuptools.exclude-package-data]
botpipe = [
  "**/__pycache__/*",
  "**/*.py[cod]",
]
labs = ["**/__pycache__/*", "**/*.py[cod]"]

[project.optional-dependencies]
claude-sdk = ["claude-agent-sdk==0.2.155"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
