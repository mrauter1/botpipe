name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and checks
        run: python -m pip install -e '.[test]' build mypy
      - name: Deterministic runtime and workflow suite
        run: python -m pytest -q -o faulthandler_timeout=60
      - name: Check public types
        run: python -m mypy --strict --follow-imports=silent tests/typecheck/provider_sdk.py
      - name: Build distributions
        run: python -m build
      - name: Smoke test installed wheel
        shell: bash
        run: |
          python -m venv .wheel-check
          if [ "$RUNNER_OS" = Windows ]; then
            wheel_python=.wheel-check/Scripts/python.exe
          else
            wheel_python=.wheel-check/bin/python
          fi
          "$wheel_python" -m pip install dist/*.whl
          "$wheel_python" -I -c 'import botpipe; from botpipe import Provider, Codex, Session, ask_human, aparallel; assert botpipe.__version__ == "2.0.0"; Provider(); Codex()'
          "$wheel_python" -I -m botpipe.cli workflows list
      - name: Check source growth
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && github.event_name == 'pull_request'
        env:
          BOTPIPE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python tools/check_source_growth.py

  codex-contract:
    name: Codex latest / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install latest stable Codex and Botpipe
        run: |
          npm install --global @openai/codex@latest
          python -m pip install -e '.[test]'
      - name: Record installed version
        run: codex --version
      - name: Prepare Ubuntu sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          # Codex uses bwrap from PATH; load Ubuntu's profile without relaxing AppArmor.
          # https://developers.openai.com/codex/concepts/sandboxing#prerequisites
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils
          if [ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          fi
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          codex sandbox /bin/true
      - name: Local fixture contracts
        env:
          BOTPIPE_NATIVE_CODEX: 'codex'
        run: python -m pytest -q tests/test_codex_contract.py -o faulthandler_timeout=60
