name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' build

      - name: Run tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/botpipe-wheel
          /tmp/botpipe-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/botpipe-wheel/bin/botpipe workflows list

  optimizer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Check native containment and portable optimizer contracts
        run: >-
          python -m pytest -q
          tests/test_budgets.py
          tests/test_dispatches.py
          tests/test_processes.py
          tests/test_candidate_v2.py
          tests/test_execution_isolation.py
          tests/test_paired_evaluation.py
          tests/test_paired_resume.py
          tests/test_provenance.py
