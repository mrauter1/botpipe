name: CI

on:
  push:
  pull_request:

jobs:
  native-contract:
    name: Native contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Download and verify current stable Codex
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import hashlib, json, os, pathlib, platform, shutil, stat, tarfile, time, urllib.error, urllib.request, zipfile
          request = urllib.request.Request(
              "https://api.github.com/repos/openai/codex/releases/latest",
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)
          windows = platform.system() == "Windows"
          asset_name = "codex-x86_64-pc-windows-msvc.exe.zip" if windows else "codex-package-x86_64-unknown-linux-musl.tar.gz"
          asset = next(item for item in release["assets"] if item["name"] == asset_name)
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "botpipe-native-codex"
          root.mkdir()
          archive = root / asset_name
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(asset["browser_download_url"], timeout=120) as response, archive.open("wb") as destination:
                      shutil.copyfileobj(response, destination)
                  break
              except urllib.error.HTTPError as error:
                  if error.code not in (429, 500, 502, 503, 504) or attempt == 2:
                      raise
                  time.sleep(2 ** attempt)
          with archive.open("rb") as handle:
              actual = "sha256:" + hashlib.file_digest(handle, "sha256").hexdigest()
          if actual != asset["digest"]:
              raise RuntimeError("Codex release asset digest mismatch")
          if windows:
              with zipfile.ZipFile(archive) as bundle:
                  members = bundle.infolist()
                  main_name = "codex-x86_64-pc-windows-msvc.exe"
                  names = set()
                  for member in members:
                      name = member.filename
                      file_type = stat.S_IFMT(member.external_attr >> 16)
                      if (not name or name in {".", ".."}
                              or any(character in name for character in '/\\:')
                              or name.endswith((".", " "))
                              or file_type not in (0, stat.S_IFREG)
                              or member.is_dir()
                              or name.casefold() in names
                              or name.casefold() == "codex.exe"):
                          raise RuntimeError(f"Unsafe or ambiguous Codex archive entry: {name!r}")
                      names.add(name.casefold())
                  if sum(member.filename == main_name for member in members) != 1:
                      raise RuntimeError(f"Codex archive must contain exactly one {main_name}")
                  # The native Windows sandbox needs the packaged helper executables
                  # beside Codex. Keep their names and rename only the main binary.
                  for member in members:
                      target = root / ("codex.exe" if member.filename == main_name else member.filename)
                      with bundle.open(member) as source, target.open("xb") as destination:
                          shutil.copyfileobj(source, destination)
                  binary = root / "codex.exe"
          else:
              with tarfile.open(archive) as bundle:
                  # Use the complete native distribution, including its matching
                  # sandbox resources, rather than the standalone executable.
                  bundle.extractall(root, filter="data")
              binary = root / "bin" / "codex"
              if not binary.is_file() or not (root / "codex-resources" / "bwrap").is_file():
                  raise RuntimeError("Codex package is missing native sandbox resources")
              binary.chmod(0o755)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"BOTPIPE_TEST_CODEX_BINARY={binary}\n")
              output.write("BOTPIPE_REQUIRE_NATIVE_CONTAINMENT=1\n")
          print(f"Testing {release['tag_name']} ({actual})")
      - name: Require native containment and provider contracts
        run: >-
          python -m pytest -q tests/test_processes.py tests/test_codex_native_contract.py
          tests/test_budgets.py::test_native_receipt_recovery_does_not_consume_another_turn

  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      BOTPIPE_REQUIRE_NATIVE_CONTAINMENT: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' build

      - name: Run tests
        run: >-
          python -m pytest -q
          -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true

      - name: Check minimum Pydantic compatibility
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install 'pydantic==2.12.0'
          python -m pytest -q tests/test_codec_state.py tests/test_codec_corrections.py tests/test_ingress_and_limits.py tests/test_input_acceptance.py tests/test_source_records.py tests/test_source_record_integration.py tests/test_callable_identity.py tests/test_callable_graph.py tests/test_callable_code_identity.py tests/test_prompt_source_context.py tests/test_portable_source_records.py tests/test_source_context.py tests/test_source_capture.py tests/test_source_anchor_runtime.py tests/test_exception_source_records.py tests/test_flag_state.py tests/test_provider_checkpoints.py tests/test_journal_reads.py tests/test_mutable_replay.py

      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: python -m build

      - name: Smoke test installed wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/botpipe-wheel
          /tmp/botpipe-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/botpipe-wheel/bin/botpipe workflows list
          /tmp/botpipe-wheel/bin/python -c "from botpipe import Provider; Provider()"
          /tmp/botpipe-wheel/bin/python -c "import tempfile; from botpipe import Botpipe, Provider; from botpipe.providers import FakeProvider; runtime=Botpipe(tempfile.mkdtemp(), provider=FakeProvider(['ok'])); assert Provider(runtime=runtime).generate('hello').value == 'ok'; runtime.close()"

      - name: Check installed public type information
        if: matrix.python-version == '3.12'
        run: |
          /tmp/botpipe-wheel/bin/pip install 'mypy>=1.15,<3'
          cp tests/typecheck_provider.py /tmp/botpipe-typecheck-provider.py
          cd /tmp
          /tmp/botpipe-wheel/bin/python -m mypy --strict --follow-imports=silent /tmp/botpipe-typecheck-provider.py

  optimizer-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Check native containment and portable optimizer contracts
        run: >-
          python -m pytest -q
          -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true
          --durations=15
          tests/test_artifacts.py
          tests/test_artifact_integration.py
          tests/test_artifact_reconciliation.py
          tests/test_artifact_attempts.py
          tests/test_artifact_rollback.py
          tests/test_codec_corrections.py
          tests/test_activity_defaults.py
          tests/test_runtime_corrections.py
          tests/test_mutable_replay.py
          tests/test_input_acceptance.py
          tests/test_source_records.py
          tests/test_source_record_integration.py
          tests/test_callable_identity.py
          tests/test_callable_graph.py
          tests/test_callable_code_identity.py
          tests/test_prompt_source_context.py
          tests/test_portable_source_records.py
          tests/test_source_context.py
          tests/test_source_capture.py
          tests/test_source_anchor_runtime.py
          tests/test_exception_source_records.py
          tests/test_flag_state.py
          tests/test_provider_checkpoints.py
          tests/test_journal_reads.py
          tests/test_sessions.py
          tests/test_provider_api.py
          tests/test_policy_replay.py
          tests/test_config.py
          tests/test_decisions.py
          tests/test_streaming.py
          tests/test_tool_evidence.py
          tests/test_workflow_builder_materialization.py
          tests/test_codec_state.py
          tests/test_ingress_and_limits.py
          tests/test_recovery_integration.py
          tests/test_recovery_outcomes.py
          tests/test_publication_generations.py
          tests/test_evidence_profiles.py
          tests/test_checkpoint_recovery.py
          tests/test_provider_response_contract.py
          tests/test_storage.py
          tests/test_budgets.py
          tests/test_dispatches.py
          tests/test_processes.py
          tests/test_codex_appserver.py
          tests/test_workspace_ownership.py
          tests/test_run_ownership.py
          tests/test_workspace_fencing.py
          tests/test_candidate_v2.py
          tests/test_execution_isolation.py
          tests/test_paired_evaluation.py
          tests/test_paired_resume.py
          tests/test_labs_optimizer_consumers.py::test_interrupted_pair_recovers_without_relaunch
          tests/test_labs_optimizer_consumers.py::test_interrupted_pair_rejects_invalid_records
          tests/test_provenance.py
